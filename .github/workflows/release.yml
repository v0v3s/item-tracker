name: Release

# Each WoW patch this addon targets gets its own long-lived branch --
# `main` for the original/current target, `main-<patch>` for every
# other one added later (e.g. `main-cata`). Whichever branch pushes,
# ItemTracker.toc's own `## X-WoW-Patch:` line (not the branch name)
# is the authoritative source for which patch a release is for, so
# release naming is correct even if a branch is renamed.
on:
  push:
    branches: [main, 'main-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine WoW patch target
        id: patch
        env:
          LC_ALL: C.UTF-8
        run: |
          patch=$(grep -oP '^## X-WoW-Patch:\s*\K.+' ItemTracker/ItemTracker.toc | tr -d '\r\n')
          if [ -z "$patch" ]; then
            echo "::error::ItemTracker/ItemTracker.toc is missing a '## X-WoW-Patch:' line -- cannot determine release naming."
            exit 1
          fi
          {
            echo "patch<<PATCH_EOF"
            echo "$patch"
            echo "PATCH_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Determine next version
        id: version
        env:
          PATCH: ${{ steps.patch.outputs.patch }}
        run: |
          git fetch --tags --quiet
          prefix="${PATCH}-v"
          last=$(git tag -l "${prefix}[0-9]*" | sed "s/^${prefix}//" | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          {
            echo "tag<<TAG_EOF"
            echo "${prefix}${next}"
            echo "TAG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        run: |
          awk '
            /^## \[Unreleased\]/ { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "_No changelog entry found for this release._" > release_notes.md
          fi

      - name: Zip addon
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: zip -r "ItemTracker-${TAG}.zip" ItemTracker

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "ItemTracker ${{ steps.version.outputs.tag }}"
          files: ItemTracker-${{ steps.version.outputs.tag }}.zip
          body_path: release_notes.md

      # Rolls CHANGELOG.md's "Unreleased" section into a dated entry for
      # the release that was just published, and opens a fresh empty
      # "Unreleased" section above it for whatever comes next -- keeps
      # the changelog historically accurate with no manual step. Pushes
      # with [skip ci] so this commit doesn't re-trigger this workflow.
      - name: Roll changelog's Unreleased section into this release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          today=$(date -u +%Y-%m-%d)
          sed -i "s/^## \[Unreleased\]\$/## [Unreleased]\n\n## [${TAG}] - ${today}/" CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "::warning::CHANGELOG.md has no '## [Unreleased]' heading to roll forward -- skipping the changelog commit."
          else
            git commit -m "chore: changelog for ${TAG} [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
