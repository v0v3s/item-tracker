name: Release

# Each WoW patch this addon targets gets its own long-lived `main-<patch>`
# branch (e.g. `main-3.3.5`, later `main-cata`), and ONLY those branches
# trigger a release -- `main` itself never does, regardless of what it
# ends up representing (a mirror of one patch today, maybe a different,
# actively-evolving target like retail later). Whichever main-* branch
# pushes, ItemTracker.toc's own `## X-WoW-Patch:` line (not the branch
# name) is the authoritative source for which patch a release is for, so
# naming is correct even if a branch is renamed.
#
# Versions are semver (MAJOR.MINOR.PATCH), scoped per patch and tagged
# `<patch>-v<semver>` (e.g. `3.3.5-v1.2.0`) -- each patch tracks its own
# version history independently. The addon's own .toc `## Version:` line
# gets just the bare semver (`1.2.0`), since that's a per-codebase concept
# an addon site reads, not tied to which WoW patch shipped it.
#
# The bump (major/minor/patch) is inferred from the branch that was
# merged in, via the merge commit's own default message (e.g. a PR
# "Merge pull request #N from owner/feat/main-3.3.5/thing", or a local
# "Merge branch 'fix/thing'"): a `feat/` branch bumps minor, `fix/` bumps
# patch, `breaking/` (or a "BREAKING CHANGE" in the message) bumps major.
# A push with no recognizable branch name in its message (e.g. a direct
# commit to main-<patch>) falls back to a patch bump -- the smallest,
# least surprising default.
on:
  push:
    branches: ['main-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine WoW patch target
        id: patch
        env:
          LC_ALL: C.UTF-8
        run: |
          patch=$(grep -oP '^## X-WoW-Patch:\s*\K.+' ItemTracker/ItemTracker.toc | tr -d '\r\n')
          if [ -z "$patch" ]; then
            echo "::error::ItemTracker/ItemTracker.toc is missing a '## X-WoW-Patch:' line -- cannot determine release naming."
            exit 1
          fi
          {
            echo "patch<<PATCH_EOF"
            echo "$patch"
            echo "PATCH_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Determine next version
        id: version
        env:
          PATCH: ${{ steps.patch.outputs.patch }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git fetch --tags --quiet
          prefix="${PATCH}-v"

          last=$(git tag -l "${prefix}[0-9]*.[0-9]*.[0-9]*" \
            | sed "s/^${prefix}//" \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -1)
          last="${last:-0.0.0}"
          IFS='.' read -r major minor patch <<< "$last"

          if echo "$COMMIT_MESSAGE" | grep -qiE '(^|/)breaking/|BREAKING CHANGE'; then
            major=$((major + 1)); minor=0; patch=0
          elif echo "$COMMIT_MESSAGE" | grep -qiE '(^|/)feat/'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          semver="${major}.${minor}.${patch}"
          {
            echo "semver<<SEMVER_EOF"
            echo "${semver}"
            echo "SEMVER_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "tag<<TAG_EOF"
            echo "${prefix}${semver}"
            echo "TAG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        run: |
          awk '
            /^## \[Unreleased\]/ { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "_No changelog entry found for this release._" > release_notes.md
          fi

      # Stamps the computed version into the SHIPPED zip's .toc only --
      # never committed back to the repo (the working copy on this
      # ephemeral runner is discarded after the job). Addon sites
      # (Warperia, CurseForge, etc.) read a .toc's own `## Version:` line
      # to detect the addon's version; it has nothing to do with the git
      # tag unless something sets it, so without this every release would
      # keep shipping whatever static placeholder is checked into source.
      - name: Stamp this release's version into the addon's own .toc
        env:
          SEMVER: ${{ steps.version.outputs.semver }}
        run: |
          sed -i "s/^## Version:.*/## Version: ${SEMVER}/" ItemTracker/ItemTracker.toc

      - name: Zip addon
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: zip -r "ItemTracker-${TAG}.zip" ItemTracker

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Without this, a brand-new tag defaults to the repository's
          # default branch (main) instead of the commit that actually
          # triggered this run -- harmless once main and main-<patch>
          # happen to match, but silently wrong whenever they don't
          # (exactly what happened here: every tag pointed at main's
          # long-stale HEAD instead of the real build).
          target_commitish: ${{ github.sha }}
          name: "ItemTracker ${{ steps.version.outputs.tag }}"
          files: ItemTracker-${{ steps.version.outputs.tag }}.zip
          body_path: release_notes.md

      # Rolls CHANGELOG.md's "Unreleased" section into a dated entry for
      # the release that was just published, and opens a fresh empty
      # "Unreleased" section above it for whatever comes next -- keeps
      # the changelog historically accurate with no manual step. Pushes
      # with [skip ci] so this commit doesn't re-trigger this workflow.
      - name: Roll changelog's Unreleased section into this release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          today=$(date -u +%Y-%m-%d)
          sed -i "s/^## \[Unreleased\]\$/## [Unreleased]\n\n## [${TAG}] - ${today}/" CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "::warning::CHANGELOG.md has no '## [Unreleased]' heading to roll forward -- skipping the changelog commit."
          else
            git commit -m "chore: changelog for ${TAG} [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
