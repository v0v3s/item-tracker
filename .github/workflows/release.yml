name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          git fetch --tags --quiet
          last=$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

      - name: Zip addon
        run: zip -r "ItemTracker-${{ steps.version.outputs.tag }}.zip" ItemTracker

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: ItemTracker-${{ steps.version.outputs.tag }}.zip
